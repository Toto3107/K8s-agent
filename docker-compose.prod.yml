version: '3.9'

# Production docker-compose — used on DigitalOcean Droplet
# Images pulled from Docker Hub, not built locally

services:
  backend:
    image: ${DOCKER_HUB_USERNAME}/ai-k8s-agent-backend:latest
    container_name: k8s-agent-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-anthropic/claude-3-haiku}
      - KUBECONFIG_PATH=${KUBECONFIG_PATH:-}
    volumes:
      # Mount kubeconfig if you want to investigate a real cluster from the droplet
      - ~/.kube:/root/.kube:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    image: ${DOCKER_HUB_USERNAME}/ai-k8s-agent-frontend:latest
    container_name: k8s-agent-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://${DROPLET_HOST}:8000
    depends_on:
      backend:
        condition: service_healthy

  # Nginx reverse proxy — serves both on port 80
  nginx:
    image: nginx:alpine
    container_name: k8s-agent-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
