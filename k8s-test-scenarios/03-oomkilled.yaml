# Scenario 3: OOMKilled — Container exceeds memory limit
# The container will be killed by the OS OOM killer
#
# Apply: kubectl apply -f 03-oomkilled.yaml
# Clean: kubectl delete -f 03-oomkilled.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-hog
  namespace: default
  labels:
    app: memory-hog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memory-hog
  template:
    metadata:
      labels:
        app: memory-hog
    spec:
      containers:
        - name: memory-hog
          image: polinux/stress
          command: ["stress"]
          # Allocates 200MB but limit is 50Mi — will be OOMKilled
          args: ["--vm", "1", "--vm-bytes", "200M", "--timeout", "60s"]
          resources:
            requests:
              memory: "10Mi"
              cpu: "50m"
            limits:
              memory: "50Mi"  # Too low — will OOMKill
              cpu: "100m"
